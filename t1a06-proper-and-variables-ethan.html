<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>t1a06-proper-and-variables-ethan.html</title>
    <script>
        function sayhello() {
            let myNum = 3;
            let myString = 'hello ';
            let myFloat = 17.5;
            let myBool = true;
            let myOut = document.getElementById('myDiv01');
            
            myOut.innerHTML = myNum + myString + myFloat + ',' + myBool;
            if (myBool) {
                myOut.innerHTML += ', wow';
            }
        }
    </script>
</head>
<body>
    <p>This is <B>bold</B> text.</p>
    <button onclick="sayhello()">Click me</button>
    <div id="myDiv01">...</div>
</body>
</html>
